databases:
  main_db:
    type: mysql
    host: ${DB_MAIN_HOST}
    port: 3306
    user: ${DB_MAIN_USER}
    password: ${DB_MAIN_PASSWORD}
    database: ${DB_MAIN_NAME}
    schemas: auto
    exclude_schemas: [mysql, information_schema, performance_schema, sys]
    readonly: true
    description: "Основная БД"

  pg_local:
    type: postgresql
    host: localhost
    port: 5432
    user: postgres
    password: ${PG_LOCAL_PASSWORD}
    database: postgres
    readonly: true

  sqlite_local:
    type: sqlite
    path: data/test.db
    # readonly не поддерживается драйвером aiosqlite; защита — только валидатор SQL
