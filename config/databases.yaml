databases:
  main_db:
    type: mysql
    host: ${DB_MAIN_HOST}
    port: 3306
    user: ${DB_MAIN_USER}
    password: ${DB_MAIN_PASSWORD}
    database: ${DB_MAIN_NAME}
    schemas: auto
    exclude_schemas: [mysql, information_schema, performance_schema, sys]
    description: "Основная БД"
    readonly: true
    is_mariadb: false       # true, если СУБД — MariaDB (отключает MAX_EXECUTION_TIME)
    charset: utf8mb4
    minsize: 1
    maxsize: 5

  pg_local:
    type: postgresql
    host: localhost
    port: 5432
    user: postgres
    password: ${PG_LOCAL_PASSWORD}
    database: postgres
    description: "Локальная PostgreSQL для тестов"
    readonly: true
    schemas: [public]
    min_size: 1
    max_size: 5

  sqlite_local:
    type: sqlite
    path: data/test.db
    description: "Локальная SQLite для тестов"
    readonly: true
    # Внимание: драйвер aiosqlite не поддерживает readonly на уровне СУБД.
    # Защита: PRAGMA query_only = ON (выставляется в db_manager при readonly: true)
    # и валидатор SQL.