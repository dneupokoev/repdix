# config/templates.yaml
# Здесь описываются детерминированные шаблоны для типовых запросов.
# Они позволяют боту мгновенно отвечать без участия LLM, гарантируя точность.
#
# Поля:
#   name: Имя шаблона (для логов)
#   keywords: Список ключевых слов. Если хотя бы одно есть в тексте — шаблон применяется.
#   table: Имя таблицы по умолчанию (если модель не нашла таблицу в тексте).
#   schema_fallback: Пытаться ли найти правильное поле через get_table_schema.
#   reviewer_fields: Возможные названия полей для имени пользователя.
#   action_field: Поле, где хранится действие (save/skip).
#   action_value: Значение для фильтрации правок.
#   time_field: Поле с датой.
#   group_by_field: Поле для группировки.
#   limit: Если указано (например, 5), выбирает Топ-N. Если нет — выводит всех.
#   templates_text: Шаблоны для вывода (используйте {name}, {count}, {period}).

- name: who_worked
  description: "Используй этот шаблон, если пользователь спрашивает, кто работал, кто вносил правки, или сколько действий было за период."
  table: c2t_asr_training_review
  reviewer_fields: ["reviewer", "user", "operator", "employee", "author", "login"]
  time_field: "created_at"
  group_by_field: "reviewer"
  limit: 100

- name: top_n_edits
  description: "Используй этот шаблон для рейтингов (топ-N, лучшие, худшие). Всегда передавай параметр limit, если пользователь указал число."
  table: c2t_asr_training_review
  reviewer_fields: ["reviewer", "user", "operator", "employee", "author", "login"]
  action_field: "button_action"
  action_value: "save"
  time_field: "created_at"
  group_by_field: "reviewer"
  limit: 5 # Значение по умолчанию, если LLM не передаст limit