# docker/compose.yaml
version: '3.8'

services:
  redis:
    build:
      context: ./
      dockerfile: dockerfiles/redis.dockerfile
    container_name: repdix_redis
    restart: always
    volumes:
      - ./redis/data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ./
      dockerfile: dockerfiles/app.dockerfile
    container_name: repdix_app
    restart: always
    stop_grace_period: 60s
    stop_signal: SIGTERM
    env_file: ../.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ../config:/app/config
      - ../logs:/app/logs
      - ../data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import redis; r = redis.Redis(host='redis', port=6379); assert r.ping()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400