# docker/dockerfiles/redis.conf
# ==================== ОСНОВНЫЕ НАСТРОЙКИ ====================
port 6379
bind 0.0.0.0
protected-mode no

# ==================== ПАМЯТЬ ====================
# Лимит памяти для хранения истории диалогов и кэша схем
maxmemory 256mb
maxmemory-policy allkeys-lru

# ==================== ДЕФРАГМЕНТАЦИЯ ====================
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 5
active-defrag-cycle-max 75

# ==================== ПРОИЗВОДИТЕЛЬНОСТЬ ====================
timeout 300
tcp-keepalive 300
maxclients 1000
databases 16

# ==================== СОХРАНЕНИЕ (PERSISTENCE) ====================
# RDB-снимки (реже, чтобы не нагружать диск)
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# ==================== ЛОГИРОВАНИЕ ====================
loglevel notice
logfile /data/redis.log

# ==================== УВЕДОМЛЕНИЯ ====================
notify-keyspace-events gxE

# ==================== БЕЗОПАСНОСТЬ ====================
# Отключить опасные команды (раскомментировать при необходимости)
# rename-command CONFIG ""
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""